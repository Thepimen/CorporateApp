<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Nosotros</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Nuestra empresa</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p>Empresa especializada en soluciones basadas en Angular, Ionic y Node.js.</p>
      <p *ngIf="distancia !== null" style="font-weight: bold; margin-top: 15px; color: #8C0014;">
        Distancia a nuestras oficinas (Calle Arcos de Jalón 18, Madrid): {{ distancia }} km
      </p>
      <p *ngIf="errorGps" style="color: red; margin-top: 15px;">{{ errorGps }}</p>
      <ion-button expand="block" fill="outline" class="ion-margin-top" (click)="cargarUbicacion()">
        Recalcular distancia
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
