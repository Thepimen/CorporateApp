<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Contacto</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Formulario</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item>
        <ion-input [(ngModel)]="correo" type="email" placeholder="Correo electrónico"></ion-input>
      </ion-item>
      <ion-item class="ion-margin-top">
        <ion-textarea [(ngModel)]="mensaje" placeholder="Mensaje"></ion-textarea>
      </ion-item>
      <ion-button expand="block" class="ion-margin-top" (click)="enviar()">Enviar</ion-button>
    </ion-card-content>
  </ion-card>

  <ion-card *ngIf="ultimo" class="ion-margin-top">
    <ion-card-header>
      <ion-card-title>Último Mensaje Guardado</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p><strong>Correo:</strong> {{ ultimo.correo }}</p>
      <p><strong>Mensaje:</strong> {{ ultimo.mensaje }}</p>
    </ion-card-content>
  </ion-card>
</ion-content>
