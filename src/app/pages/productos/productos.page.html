<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Catálogo Marketplace</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-grid>
    <!-- Encabezado de la tabla -->
    <ion-row class="header-row">
      <ion-col size="1"><strong>ID</strong></ion-col>
      <ion-col size="2"><strong>Foto</strong></ion-col>
      <ion-col size="3"><strong>Nombre</strong></ion-col>
      <ion-col size="3"><strong>Vendedor</strong></ion-col>
      <ion-col size="1.5"><strong>Stock</strong></ion-col>
      <ion-col size="1.5"><strong>Precio</strong></ion-col>
    </ion-row>

    <!-- Filas dinámicas -->
    <ion-row *ngFor="let p of products" class="data-row">
      <ion-col size="1">{{ p.id }}</ion-col>
      <ion-col size="2">
        <img [src]="p.foto" [alt]="p.nombre" class="product-thumb" />
      </ion-col>
      <ion-col size="3">
        <strong>{{ p.nombre }}</strong>
      </ion-col>
      <ion-col size="3">
        <ion-badge color="medium" mode="ios">{{ p.vendedor }}</ion-badge>
      </ion-col>
      <ion-col size="1.5">{{ p.unidades }} ud</ion-col>
      <ion-col size="1.5" class="precio-col">{{ p.precio }} €</ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
