<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Productos</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <ion-grid>
    <ion-row style="font-weight: bold; border-bottom: 2px solid #ccc;">
      <ion-col size="2">ID</ion-col>
      <ion-col size="4">Nombre</ion-col>
      <ion-col size="2">Unid.</ion-col>
      <ion-col size="2">Precio</ion-col>
      <ion-col size="2">Foto</ion-col>
    </ion-row>
    <ion-row *ngFor="let p of products" style="align-items: center; border-bottom: 1px solid #eee;">
      <ion-col size="2">{{ p.id }}</ion-col>
      <ion-col size="4">{{ p.nombre }}</ion-col>
      <ion-col size="2">{{ p.unidades }}</ion-col>
      <ion-col size="2">{{ p.precio }} €</ion-col>
      <ion-col size="2"><img [src]="p.foto" width="50" style="border-radius: 4px;" /></ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
